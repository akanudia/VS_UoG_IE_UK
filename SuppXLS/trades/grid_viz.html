<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>MR Grid — trade links</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --border: #2c3848;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9cfd;
      --link: #6ec6a0;
      --link-cb: #e8a23a;
      --hi: #ff6b6b;
      --bus: #3d9cfd;
      --spv: #f4c430;
      --won: #6ec6a0;
      --wof: #5ec8e8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .layout { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
    aside {
      background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; min-height: 0;
    }
    aside header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    aside header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    aside header p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tabs button {
      flex: 1; background: transparent; border: 0; color: var(--muted);
      padding: 10px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .tabs button.active { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
    .search { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .search input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 12px;
    }
    .list { overflow: auto; flex: 1; padding: 6px 0; }
    .item {
      padding: 7px 14px; font-size: 12px; cursor: pointer; font-family: ui-monospace, Consolas, monospace;
      border-left: 3px solid transparent;
    }
    .item:hover { background: rgba(255,255,255,0.04); }
    .item.selected { background: rgba(61,156,253,0.12); }
    .item.kind-bus { border-left-color: var(--bus); }
    .item.kind-spv { border-left-color: var(--spv); }
    .item.kind-won { border-left-color: var(--won); }
    .item.kind-wof { border-left-color: var(--wof); }
    .item.kind-other { border-left-color: var(--muted); }
    .item.selected.kind-bus { background: rgba(61,156,253,0.12); }
    .item.selected.kind-spv { background: rgba(244,196,48,0.12); }
    .item.selected.kind-won { background: rgba(110,198,160,0.12); }
    .item.selected.kind-wof { background: rgba(94,200,232,0.12); }
    .item .sub { color: var(--muted); font-size: 10px; margin-top: 2px; font-family: inherit; }
    .item .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
    }
    .dot-bus { background: var(--bus); }
    .dot-spv { background: var(--spv); }
    .dot-won { background: var(--won); }
    .dot-wof { background: var(--wof); }
    .dot-other { background: var(--muted); }
    #map { height: 100%; background: #0a0e12; }
    .legend {
      position: absolute; z-index: 500; right: 12px; bottom: 12px;
      background: rgba(26,34,44,0.92); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; font-size: 11px; color: var(--muted);
      line-height: 1.55;
    }
    .legend .row { display: flex; align-items: center; gap: 8px; }
    .legend .line { display: inline-block; width: 18px; height: 3px; }
    .legend .dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      border: 1.5px solid currentColor; background: #1a222c;
    }
    .legend .dom { background: var(--link); }
    .legend .cb { background: var(--link-cb); }
    .legend .c-bus { color: var(--bus); }
    .legend .c-spv { color: var(--spv); background: var(--spv); }
    .legend .c-won { color: var(--won); background: var(--won); }
    .legend .c-wof { color: var(--wof); background: var(--wof); }
  </style>
</head>

    </div>

cross_border":false},{"tech":"g_Wick_GBR-Elgin_GBR","comm1":"e_Wick_GBR","comm2":"e_Elgin_GBR","reg1":"GBR","reg2":"GBR","comm":"ELC","tradelink":"B","sheet":"grid_links_GBR","cross_border":false},{"tech":"g_Wick_GBR-Lerwick_GBR","comm1":"e_Wick_GBR","comm2":"e_Lerwick_GBR","reg1":"GBR","reg2":"GBR","comm":"ELC","tradelink":"B","sheet":"grid_links_GBR","cross_border":false},{"tech":"g_Ballincollig_IRL-Cork_IRL","comm1":"e_Ballincollig_IRL","comm2":"e_Cork_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Cork_IRL-Waterford_IRL","comm1":"e_Cork_IRL","comm2":"e_Waterford_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Drogheda_IRL-DunDealgan_IRL","comm1":"e_Drogheda_IRL","comm2":"e_DunDealgan_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Dublin_IRL-Drogheda_IRL","comm1":"e_Dublin_IRL","comm2":"e_Drogheda_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Dublin_IRL-Greystones_IRL","comm1":"e_Dublin_IRL","comm2":"e_Greystones_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Dublin_IRL-Waterford_IRL","comm1":"e_Dublin_IRL","comm2":"e_Waterford_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Greystones_IRL-Waterford_IRL","comm1":"e_Greystones_IRL","comm2":"e_Waterford_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Limerick_IRL-Cork_IRL","comm1":"e_Limerick_IRL","comm2":"e_Cork_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Limerick_IRL-Dublin_IRL","comm1":"e_Limerick_IRL","comm2":"e_Dublin_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Longford_IRL-Drogheda_IRL","comm1":"e_Longford_IRL","comm2":"e_Drogheda_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Longford_IRL-Dublin_IRL","comm1":"e_Longford_IRL","comm2":"e_Dublin_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Longford_IRL-Limerick_IRL","comm1":"e_Longford_IRL","comm2":"e_Limerick_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Shannon_IRL-Ballincollig_IRL","comm1":"e_Shannon_IRL","comm2":"e_Ballincollig_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Shannon_IRL-Dublin_IRL","comm1":"e_Shannon_IRL","comm2":"e_Dublin_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Shannon_IRL-Limerick_IRL","comm1":"e_Shannon_IRL","comm2":"e_Limerick_IRL","reg1":"IRL","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_IRL","cross_border":false},{"tech":"g_Lisburn_GBR-DunDealgan_IRL","comm1":"e_Lisburn_GBR","comm2":"e_DunDealgan_IRL","reg1":"GBR","reg2":"IRL","comm":"ELC","tradelink":"B","sheet":"grid_links_crossborder","cross_border":true}],"meta":{"source":"C:\\Veda\\Veda\\Veda_models\\vervestacks_models\\VS_UoG_IE_UK\\SuppXLS\\trades\\scentrade__trade_links.xlsx","node_sheets":["grid_links_GBR","grid_links_IRL"],"link_sheets":["grid_links_GBR","grid_links_IRL","grid_links_crossborder"],"n_nodes":148,"n_links":51}}</script>
  <script>
    const DATA = JSON.parse(document.getElementById('grid-data').textContent);
    const nodesById = Object.fromEntries((DATA.nodes || []).map(n => [n.commodity, n]));
    let tab = 'commodities';
    let selected = null;
    let map, nodeLayer, linkLayer, hiLayer;

    const KIND_STYLE = {
      bus:   { radius: 5, color: '#3d9cfd', fillColor: '#1a222c', fillOpacity: 0.9, weight: 1.5 },
      spv:   { radius: 6, color: '#f4c430', fillColor: '#f4c430', fillOpacity: 0.85, weight: 1 },
      won:   { radius: 6, color: '#6ec6a0', fillColor: '#6ec6a0', fillOpacity: 0.85, weight: 1 },
      wof:   { radius: 6, color: '#5ec8e8', fillColor: '#5ec8e8', fillOpacity: 0.85, weight: 1 },
      other: { radius: 5, color: '#8b9aab', fillColor: '#1a222c', fillOpacity: 0.9, weight: 1 },
    };

    function nodeKind(n) {
      if (n && n.kind) return n.kind;
      const c = (n && n.commodity || '').toLowerCase();
      if (c.startsWith('elc_spv_')) return 'spv';
      if (c.startsWith('elc_won_')) return 'won';
      if (c.startsWith('elc_wof_')) return 'wof';
      if (c.startsWith('e_')) return 'bus';
      return 'other';
    }

    function kindStyle(kind) {
      return KIND_STYLE[kind] || KIND_STYLE.other;
    }

    const counts = { bus: 0, spv: 0, won: 0, wof: 0, other: 0 };
    (DATA.nodes || []).forEach(n => { counts[nodeKind(n)] = (counts[nodeKind(n)] || 0) + 1; });
    document.getElementById('meta').textContent =
      `${DATA.meta?.n_nodes ?? 0} nodes · ${DATA.meta?.n_links ?? 0} links`
      + ` · ${counts.bus} bus / ${counts.spv} spv / ${counts.won} won / ${counts.wof} wof`;

    function initMap() {
      map = L.map('map', { zoomControl: true });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 18
      }).addTo(map);
      linkLayer = L.layerGroup().addTo(map);
      nodeLayer = L.layerGroup().addTo(map);
      hiLayer = L.layerGroup().addTo(map);
      drawBase();
      const pts = (DATA.nodes || []).filter(n => n.lat != null && n.lng != null);
      if (pts.length) {
        map.fitBounds(L.latLngBounds(pts.map(n => [n.lat, n.lng])), { padding: [40, 40] });
      } else {
        map.setView([50, 10], 4);
      }
    }

    function drawBase() {
      linkLayer.clearLayers();
      nodeLayer.clearLayers();
      (DATA.links || []).forEach(link => {
        const a = nodesById[link.comm1], b = nodesById[link.comm2];
        if (!a || !b) return;
        L.polyline([[a.lat, a.lng], [b.lat, b.lng]], {
          color: link.cross_border ? '#e8a23a' : '#6ec6a0',
          weight: 2, opacity: 0.75
        }).bindTooltip(link.tech || '', { sticky: true }).addTo(linkLayer);
      });
      // Buses under RE so fuel clusters stay visible on top
      const ordered = [...(DATA.nodes || [])].sort((a, b) => {
        const ra = nodeKind(a) === 'bus' ? 0 : 1;
        const rb = nodeKind(b) === 'bus' ? 0 : 1;
        return ra - rb;
      });
      ordered.forEach(n => {
        if (n.lat == null || n.lng == null) return;
        const kind = nodeKind(n);
        const st = kindStyle(kind);
        L.circleMarker([n.lat, n.lng], st)
          .bindTooltip(`${n.commodity} (${n.kind_label || kind})`, { direction: 'top' })
          .addTo(nodeLayer);
      });
    }

    function highlight() {
      hiLayer.clearLayers();
      nodeLayer.eachLayer(l => l.setStyle({ opacity: selected ? 0.25 : 1, fillOpacity: selected ? 0.25 : 0.9 }));
      linkLayer.eachLayer(l => l.setStyle({ opacity: selected ? 0.15 : 0.75 }));
      if (!selected) return;
      if (selected.kind === 'node') {
        const n = nodesById[selected.id];
        if (!n) return;
        const st = kindStyle(nodeKind(n));
        L.circleMarker([n.lat, n.lng], {
          radius: 10, color: '#ff6b6b', weight: 2, fillColor: st.fillColor, fillOpacity: 0.95
        }).addTo(hiLayer);
        (DATA.links || []).forEach(link => {
          if (link.comm1 !== selected.id && link.comm2 !== selected.id) return;
          const a = nodesById[link.comm1], b = nodesById[link.comm2];
          if (!a || !b) return;
          L.polyline([[a.lat, a.lng], [b.lat, b.lng]], {
            color: '#ff6b6b', weight: 3.5, opacity: 1
          }).addTo(hiLayer);
        });
        map.panTo([n.lat, n.lng]);
      } else if (selected.kind === 'link') {
        const link = (DATA.links || []).find(l => l.tech === selected.id);
        if (!link) return;
        const a = nodesById[link.comm1], b = nodesById[link.comm2];
        if (!a || !b) return;
        L.polyline([[a.lat, a.lng], [b.lat, b.lng]], {
          color: '#ff6b6b', weight: 4, opacity: 1
        }).addTo(hiLayer);
        L.circleMarker([a.lat, a.lng], { radius: 8, color: '#ff6b6b', fillColor: '#ff6b6b', fillOpacity: 0.9 }).addTo(hiLayer);
        L.circleMarker([b.lat, b.lng], { radius: 8, color: '#ff6b6b', fillColor: '#ff6b6b', fillOpacity: 0.9 }).addTo(hiLayer);
        map.fitBounds(L.latLngBounds([[a.lat, a.lng], [b.lat, b.lng]]), { padding: [60, 60] });
      }
    }

    function renderList() {
      const q = (document.getElementById('filter').value || '').toLowerCase();
      const el = document.getElementById('list');
      el.innerHTML = '';
      const items = tab === 'commodities'
        ? (DATA.nodes || []).map(n => {
            const k = nodeKind(n);
            return {
              kind: 'node',
              id: n.commodity,
              label: n.commodity,
              sub: `${n.region || ''} · ${n.kind_label || k}`,
              nodeKind: k,
            };
          })
        : (DATA.links || []).map(l => ({ kind: 'link', id: l.tech, label: l.tech, sub: `${l.comm1} → ${l.comm2}`, nodeKind: '' }));
      items.filter(it => !q || it.label.toLowerCase().includes(q) || (it.sub || '').toLowerCase().includes(q))
        .forEach(it => {
          const div = document.createElement('div');
          const nk = it.nodeKind || '';
          div.className = 'item'
            + (nk ? ` kind-${nk}` : '')
            + (selected && selected.id === it.id ? ' selected' : '');
          const dot = nk ? `<span class="dot dot-${nk}"></span>` : '';
          div.innerHTML = `<div>${dot}${it.label}</div><div class="sub">${it.sub || ''}</div>`;
          div.onclick = () => {
            selected = (selected && selected.id === it.id) ? null : { kind: it.kind, id: it.id };
            renderList();
            highlight();
          };
          el.appendChild(div);
        });
    }

    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        tab = btn.dataset.tab;
        selected = null;
        renderList();
        highlight();
      };
    });
    document.getElementById('filter').oninput = renderList;

    initMap();
    renderList();
  </script>
</body>
